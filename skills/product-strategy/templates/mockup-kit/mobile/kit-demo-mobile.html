     снимок и проверка — shoot_mockups.mjs <OUT> --kit (замечания — в data/mockups-check._kit-demo-mobile.json). -->

  @media (max-width: 440px) { .kd-icons { padding: 12px; } .kd-icons-head { padding: 0 12px; } }
</style>

  <!-- 5. Рабочий стол: всплывающее уведомление, виджет, иконки, док -->
  <div class="pm-frame">

      <div class="pm-status"><span>9:45</span><span class="pm-status-icons"><i class="ps-i ps-i-signal"></i><i class="ps-i ps-i-wifi"></i><i class="ps-i ps-i-battery"></i></span></div>
      <div class="pm-notif is-heads-up"><div class="pm-notif-head"><span class="pm-notif-ico"><i class="ps-i ps-i-bell"></i></span><b>Дела</b>· сейчас</div>

<section class="kd-theme" data-theme="light"><div class="pm-board"><h2 class="kd-title">Светлая тема</h2><div class="kd-slot" style="display:contents"></div></div></section>
<section class="kd-theme" data-theme="dark"><div class="pm-board"><h2 class="kd-title">Тёмная тема</h2><div class="kd-slot" style="display:contents"></div></div></section>
<section class="kd-theme" data-theme="light" style="background:var(--c-bg)">
  <div class="kd-icons-head"><h2>Иконки <span class="ps-muted ps-small">— class="ps-i ps-i-&lt;имя&gt;", цвет currentColor</span></h2></div>
  <div class="kd-icons" id="kd-icons"></div>
</section>

<script>
// Одинаковые экраны в обеих темах и галерея иконок (список = _icons.css; тест сверяет)
(function () {
  var tpl = document.getElementById('kd-phones');
  document.querySelectorAll('.kd-slot').forEach(function (slot) { slot.appendChild(tpl.content.cloneNode(true)); });
  var ICONS = ['menu', 'back', 'forward', 'close', 'search', 'more', 'more-h', 'plus', 'minus', 'check', 'chevron-right', 'chevron-left', 'chevron-down',
    'chevron-up', 'home', 'list', 'grid', 'settings', 'sliders', 'user', 'users', 'bell', 'mic', 'mic-off', 'play', 'pause', 'stop', 'record', 'wave',
    'star', 'heart', 'bookmark', 'trash', 'share', 'edit', 'copy', 'download', 'upload', 'send', 'calendar', 'clock', 'lock', 'camera', 'image', 'pin',
    'chat', 'mail', 'phone', 'wifi', 'signal', 'battery', 'flashlight', 'filter', 'info', 'alert', 'shield', 'gift', 'cart', 'card', 'chart', 'doc',
    'folder', 'globe', 'sun', 'moon', 'eye', 'link', 'refresh', 'sparkle', 'text', 'headphones', 'volume', 'qr', 'book', 'tag', 'logout'];
  var box = document.getElementById('kd-icons');
  box.innerHTML = ICONS.map(function (n) { return '<div><i class="ps-i ps-i-' + n + '"></i>' + n + '</div>'; }).join('');
})();

// Автопроверка контраста текста (WCAG: 4,5:1, крупный текст ≥ 24px или ≥ 18,66px жирный — 3:1).
// Градиенты: проверяется каждый цвет градиента (худший случай); картинки-фоны пропускаются.
// Итог: window.psContrast = {checked, fails}; каждое нарушение — console.error (shoot_mockups считает это замечанием).
(function () {
  var cv = document.createElement('canvas'); cv.width = cv.height = 1;
  var cx = cv.getContext('2d', { willReadFrequently: true });
  var COLOR_RE = /(?:rgba?|hsla?|color|oklab|oklch|lab|lch)\((?:[^()]|\([^()]*\))*\)|#[0-9a-fA-F]{3,8}\b/g;
  function rgba(c) {
    if (!c || c === 'transparent') return [0, 0, 0, 0];
    cx.clearRect(0, 0, 1, 1); cx.fillStyle = '#000'; cx.fillStyle = c; cx.fillRect(0, 0, 1, 1);
    var d = cx.getImageData(0, 0, 1, 1).data; return [d[0], d[1], d[2], d[3] / 255];
  }
  function over(top, under) { var a = top[3]; return [top[0] * a + under[0] * (1 - a), top[1] * a + under[1] * (1 - a), top[2] * a + under[2] * (1 - a), 1]; }
  function lum(c) { var f = function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); }
  function ratio(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  function backgrounds(el) {
    var layers = [];
    for (var e = el; e && e.nodeType === 1; e = e.parentElement) {
      var s = getComputedStyle(e), img = s.backgroundImage, done = false;
      if (img && img !== 'none') {
        if (!/gradient/.test(img) || /url\(/.test(img)) return null;
        var g = (img.match(COLOR_RE) || []).map(rgba);
        if (!g.length) return null;
        layers.push(g); done = g.every(function (x) { return x[3] >= 0.999; });
      }
      if (!done) { var c = rgba(s.backgroundColor); if (c[3] > 0) { layers.push([c]); done = c[3] >= 0.999; } }
      if (done) break;
    }
    var bases = [[255, 255, 255, 1]];
    for (var i = layers.length - 1; i >= 0; i--) {
      var next = [];
      bases.forEach(function (b) { layers[i].forEach(function (l) { next.push(over(l, b)); }); });
      bases = next.slice(0, 32);
    }
    return bases;
  }
  function run() {
    var fails = [], checked = 0;
    document.querySelectorAll('body *').forEach(function (el) {
      if (el.closest('[aria-hidden="true"], script, style, template, .ps-lock-body')) return;
      var own = false;
      for (var n = el.firstChild; n; n = n.nextSibling) if (n.nodeType === 3 && n.textContent.trim()) { own = true; break; }
      if (!own) return;
      var r = el.getBoundingClientRect(); if (!r.width || !r.height) return;
      var s = getComputedStyle(el);
      if (s.visibility === 'hidden' || +s.opacity === 0 || el.matches(':disabled, .is-disabled')) return;
      var bgs = backgrounds(el); if (!bgs) return;
      var col = rgba(s.color), k = Infinity;
      bgs.forEach(function (bg) { k = Math.min(k, ratio(over(col, bg), bg)); });
      var size = parseFloat(s.fontSize), bold = parseInt(s.fontWeight, 10) >= 700;
      var need = (size >= 24 || (bold && size >= 18.66)) ? 3 : 4.5;
      checked++;
      if (k + 1e-6 < need) {
        var theme = (el.closest('[data-theme]') || document.documentElement).getAttribute('data-theme') || 'light';
        var cls = (el.className && typeof el.className === 'string') ? '.' + el.className.trim().split(/\s+/).join('.') : el.tagName.toLowerCase();
        var rec = { theme: theme, el: cls, text: el.textContent.trim().slice(0, 40), ratio: Math.round(k * 100) / 100, need: need };
        fails.push(rec);
        console.error('контраст ' + rec.ratio + ':1 < ' + need + ' — ' + rec.el + ' «' + rec.text + '» (' + theme + ')');
      }
    });
    window.psContrast = { checked: checked, fails: fails };
    document.documentElement.setAttribute('data-contrast', fails.length ? 'fail:' + fails.length : 'ok');
  }
  if (document.readyState === 'complete') run(); else window.addEventListener('load', run);
})();
</script>
</body>
</html>
