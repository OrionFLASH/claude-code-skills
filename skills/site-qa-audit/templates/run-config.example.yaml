# run-config.yaml — конфиг одного прогона site-qa-audit.
# Создаётся скилом по итогам опроса (references/intake.md) в <OUTPUT_ROOT>/qa-runs/<YYYY-MM-DD>-<host>/
# (черновик из свободного запроса — scripts/intake.py from-text).
# Формат — подмножество YAML (shared/scripts/miniyaml.py): без якорей и inline-словарей.
# Секреты сюда НЕ пишутся — только имена переменных окружения.

version: 1
output_dir: /abs/path/to/results   # OUTPUT_ROOT: путь из запроса / SITE_QA_OUTPUT_DIR / <cwd>; результаты в <OUTPUT_ROOT>/qa-runs/
skill_dir: /abs/path/to/site-qa-audit  # SKILL_DIR прогона: python3 <скил>/scripts/skill_dir.py (SITE_QA_AUDIT_DIR / плагин);
                              # подставляется в блок §4 и задания исполнителей, исполнитель проверяет его до работы
mode: dry-run                 # live | dry-run (dry-run: всё, кроме публикации; черновики в drafts/)
language: ru                  # язык отчётов и issues

site:
  start_urls:
    - https://example.com/
  # Навигация: только эти хосты. "*.example.com" — любой поддомен, "example.com" — ровно хост.
  allowed_domains:
    - example.com
    - "*.example.com"
  # Загрузка сторонних ресурсов (CDN, тайлы, API, шрифты) разрешена всегда, если не запрещена ниже.
  # Список заполняется на разведке — для отчёта, не для блокировки.
  third_party_resources: []

auth:
  mode: none                  # none | test-account | manual | manual-cdp
                              # manual-cdp — пользователь уже вошёл в своём Chrome (--remote-debugging-port);
                              # скил присоединяется по CDP и НЕ очищает cookies/localStorage (references/devices-auth.md)
  cdp_url: http://127.0.0.1:9222   # только для manual-cdp
  login_url: null
  username_env: QA_USERNAME   # только имена переменных окружения
  password_env: QA_PASSWORD
  account_states: []          # состояния аккаунта для проверок: guest | free | pro | своё; пишутся в находку (account_state)

scope:
  type: whole-site            # whole-site | section | url-list | current-screen
  section_prefix: null        # для section, например /catalog/
  urls: []                    # для url-list
  page_limit: 50              # для глубины standard
  exclude_patterns: []        # регэкспы URL, исключённые пользователем после разведки

goal:                         # что тестируем и что считать успехом (references/intake.md, вопросы 2 и 10)
  focus: [main-flows]         # main-flows | section | form | responsive | accessibility | performance | seo | content | all
  notes: null                 # уточнение: какие сценарии, раздел или форма
  success: findings           # findings (список проблем) | scenarios (сценарии проходят) | release-gate (блокеров нет) | custom
  success_notes: null         # свой критерий; для scenarios — какие сценарии должны проходить

context:                      # что известно о сайте (intake.md → «Память о сайте», вопросы 11–11a)
  reuse: new                  # new | as-is | update | relearn — при наличии <OUTPUT_ROOT>/qa-runs/.site-context/<host>/context.md
  sources:                    # откуда узнать о сайте
    - type: site              # site | docs | github | file | chat | none
  notes: null                 # что важно изучить: роли, платные функции, терминология (свободный текст)
  # Пример источников:
  #  - type: docs
  #    ref: https://example.com/help/
  #  - type: github
  #    ref: owner/repo
  #  - type: file
  #    ref: /abs/path/to/notes.md

directions:                   # functional, logic-state, ux, visual-ui, responsive-cross-browser,
  - functional                # accessibility, performance, seo-content, content-i18n, security-passive, product
  - ux
  - accessibility

depth: smoke                  # smoke | standard | deep

devices:                      # по умолчанию — из depth-matrix.md
  viewports:
    - name: desktop
      width: 1440
      height: 900
    - name: mobile
      width: 375
      height: 812
  browsers:
    - chromium
  emulate: []                 # имена из device_context.js list: pixel7, pixel7-landscape, iphone15, ipad, 360x640, low…
  # Пример: [pixel7, pixel7-landscape, iphone15, ipad] — детекторы и shot.js принимают их в --device

repos: []
# Пример записи репозитория:
#  - url: https://github.com/owner/repo
#    roles: [check]              # check | write-new | copies | comment (одна или несколько)
#    style: brief                # brief | detailed
#    labels: existing            # existing | create | inline
#    confirm_before_publish: true
#    screenshots: none           # commit | web-upload | none
#                                # web-upload — чужой/приватный репозиторий: загрузка через веб-форму GitHub
#                                # в браузере пользователя (вход вручную), references/web-upload.md
#    screenshots_path: runs      # куда класть при commit: runs/<дата>/
#    web_upload:                 # только для screenshots: web-upload
#      cdp: http://127.0.0.1:9222   # Chrome пользователя с --remote-debugging-port, вход на GitHub выполнен
#      base_url: https://github.com
#    disclosure: full            # full | none — none: без подписи «Создано site-qa-audit», без источников и маркера скила
#    cross_links: true           # false — без ссылок на issues других репозиториев (render_draft.py --no-links)
#    marker: skill               # skill | neutral (<!-- qa-fp:… -->) | none; по умолчанию skill при full, none при disclosure: none
#    closed_claims: comment      # недоработка в закрытом issue: comment (комментарий в нём) | new (новый issue) | skip (только отчёт)
#    severity_map:               # шкала репозитория ↔ шкала скила (из формы и документов репозитория)
#      critical: Блокирует
#      high: Серьёзно
#      medium: Обычно
#      low: Незначительно
#      info: Незначительно

report_destinations:          # куда записать итоги, кроме <RUN_DIR> (intake.md, вопрос 18; SKILL.md, шаг 11)
  - type: local               # local | folder | github | artifact | custom
# Пример:
#  - type: folder
#    path: /abs/path/to/reports   # только итоговые файлы: summary.md, report.md, findings.json, скриншоты находок
#                                 # → <path>/<YYYY-MM-DD>-<host>/ (export_results.py); без raw/, logs/, drafts/
#  - type: github
#    repo: owner/repo             # итоговый issue со сводкой (references/repo-sync.md §4–5); репозиторий — и в repos
#  - type: artifact               # страница из report.md через инструмент Artifact, если он есть в сессии; иначе пропуск
#  - type: custom
#    note: "что сделать с итогами"  # выполняется только после подтверждения

git:                          # результаты и git (references/run-files.md → «qa-runs/ и git»), до создания <RUN_DIR>
  allow_commit_results: false # true — только если пользователь явно разрешил класть результаты в репозиторий;
                              # false — qa-runs/ сразу в .gitignore (gitignore_helper.py ensure)

rules:
  # Базовые запреты (references/safety-rules.md) действуют всегда и здесь не перечисляются.
  forbidden_domains: []       # хосты/маски: навигация И загрузка ресурсов блокируются
  forbidden_url_patterns: []  # регэкспы по полному URL: навигация блокируется
  forbidden_actions: []
  # Пример:
  #  - id: U1
  #    source: "не нажимать да при подключении steam"
  #    texts: ["Да", "Yes", "Allow", "Разрешить"]   # текст кнопок/ссылок, все языки сайта
  #    roles: [button, link]
  #    selectors: []
  #    context: "steam"          # действует, если на странице/в диалоге есть этот текст
  #    url_pattern: null         # или регэксп раздела, например "/profile"
  require_confirmation_actions: []
  # Те же поля, что у forbidden_actions; действие выполняется только после «да» пользователя.
  preapproved_actions: []
  # Те же поля; заранее одобренные действия уровня confirm (например, удаление записей, созданных прогоном).
  # Запреты (deny) не снимают.

frames: main                  # main | all — all: детекторы заходят во iframe (вложенные приложения), references/layout-detectors.md

side_effects: []              # действия с последствиями за пределами теста (references/side-effects.md)
# Пример:
#  - id: SE1
#    action: upload            # upload | click | check
#    target: "#upload"         # селектор; ">>>" — внутрь iframe
#    effect: "сохранение попадает в публичный рейтинг без флажка «Чужое сохранение»"
#    leaves: ["локальная копия сохранения в браузере (кнопка «Запомнить»)"]

invariants: []                # что должно быть верно после (или до) действия с эффектом
# Пример:
#  - id: INV1
#    after: SE1                # id эффекта или тип действия
#    within_ms: 5000
#    require:
#      role: checkbox
#      name: "Чуж(ой|ое)"      # регэксп по доступному имени, устойчивый к переименованию
#      state: checked          # present | checked | unchecked | absent
#      ensure: false           # true — отметить самому (через guard), если появился неотмеченным
#      only_after_action: true # до действия элемента быть не должно
#    vocabulary: "Чужое сохранение"   # точное название; расхождение с прошлым прогоном → остановка и вопрос
#    else: abort               # abort | warn

plugins:
  policy: all-installed       # all-installed | selected | own-only
  selected: []

parallel:
  max_workers: 2              # 1–4 параллельных браузерных потока (максимум 4); manual / manual-cdp — 1 (references/parallelism.md)
  throttle_ms: 1500           # пауза между действиями в браузере
