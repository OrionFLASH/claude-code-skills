<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Фикстура (д): прокручиваемый список под закреплённой панелью</title>
<style>
  body { margin: 0; font: 14px sans-serif; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: #222; color: #fff; z-index: 100; display: flex; gap: 8px; align-items: center; padding: 0 12px; }
  main { padding-top: 64px; }
  /* Rating-like container: max-height 70vh, long content, no tabindex */
  #rating { max-height: 70vh; overflow-y: auto; border: 1px solid #ccc; margin: 0 12px; }
  #rating button { display: block; width: 100%; height: 40px; margin: 0; }
  #feed button { display: block; width: 300px; height: 40px; margin: 8px 12px; }
</style></head>
<body>
  <div id="bar"><button>Меню</button><button>Профиль</button></div>
  <main>
    <section id="rating" aria-label="Рейтинг"></section>
    <section id="feed" aria-label="Лента"></section>
  </main>
<script>
  const r = document.getElementById('rating'), f = document.getElementById('feed');
  for (let i = 1; i <= 300; i++) { const b = document.createElement('button'); b.textContent = 'Строка ' + i; r.appendChild(b); }
  for (let i = 1; i <= 40; i++) { const b = document.createElement('button'); b.textContent = 'Пункт ' + i; f.appendChild(b); }
  r.scrollTop = 4013;          // rows scrolled under the container edge (clipped, invisible)
  window.scrollTo(0, 333);     // document rows partially under the fixed bar (a scroll reveals them)
</script>
</body></html>
